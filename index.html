
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Minds 1 - Prepositions Game</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eef3ff;
  color: #263653;
}

.container {
  max-width: 850px;
  margin: 20px auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 22px;
  box-shadow: 0 6px 20px #00000010;
}

h1, h2 {
  text-align: center;
  color: #4565b5;
}

button, input { font-family: inherit; font-size: 16px; }

button {
  border: none;
  border-radius: 12px;
  padding: 12px 18px;
  background: #5578d8;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover { background: #3e5fb9; }

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

input {
  width: 100%;
  padding: 12px;
  border: 2px solid #cbd7f5;
  border-radius: 12px;
  margin: 12px 0;
}

.hidden { display: none; }

.top {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  font-weight: bold;
  margin-bottom: 15px;
}

.picture {
  width: 320px;
  height: 250px;
  max-width: 100%;
  object-fit: contain;
  display: block;
  margin: 20px auto;
  border: 2px solid #edf0f8;
  border-radius: 15px;
}

.choices {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin: 20px 0;
}

.choice {
  background: #edf2ff;
  color: #2c478d;
  border: 2px solid #d7e1ff;
}

.feedback {
  text-align: center;
  font-weight: bold;
  font-size: 18px;
  min-height: 30px;
  margin: 15px;
}

.center { text-align: center; }

.tiles {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin: 20px 0;
}

.tile {
  background: #e7edff;
  color: #29458f;
  border: 2px solid #bdccff;
}

.tile.used {
  opacity: 0.3;
  pointer-events: none;
}

.answer {
  min-height: 65px;
  border: 2px dashed #aab9df;
  border-radius: 14px;
  padding: 10px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin: 15px 0;
}

.answer .tile { background: #d9e5ff; }

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
}

.small {
  text-align: center;
  color: #73809a;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

<!-- START SCREEN -->

<section class="card" id="welcome">

<h1>🐾 Prepositions Challenge</h1>
<h2>Super Minds 1</h2>

<p class="center">Two Stages</p>

<label><b>Enter your name:</b></label>

<input
  type="text"
  id="studentName"
  placeholder="Your name"
  maxlength="35"
>

<div class="center">
<button onclick="startGame()">Start Game</button>
</div>

<p class="small">Ms.Ramezanzadeh</p>

</section>


<!-- GAME SCREEN -->

<section class="card hidden" id="game">

<div class="top">
<span id="stageLabel">Stage 1</span>
<span id="progress">Question 1</span>
<span>❤️ <span id="lives">3</span></span>
</div>

<h2 id="prompt">Choose the correct sentence.</h2>

<img id="picture" class="picture" src="" alt="Picture">

<div id="choices" class="choices"></div>

<div id="feedback" class="feedback"></div>

<div class="center">
<button id="nextBtn" class="hidden" onclick="nextQuestion()">
Next
</button>
</div>

</section>


<!-- FINISH SCREEN -->

<section class="card hidden" id="finish">

<h1 id="finishTitle"></h1>

<h2 id="finishMessage"></h2>

<p class="center" id="finishName"></p>

<p class="small">Ms.Ramezanzadeh</p>

<div class="center">
<button onclick="location.reload()">Play Again</button>
</div>

</section>

</div>


<script>

// ===================================
// STAGE 1: PICTURE SENTENCES
// ===================================

const stage1 = [

{
img: "cat_on_box.png",
answer: "The cat is on the box.",
options: [
"The cat is in the box.",
"The cat is on the box.",
"The cat is under the box."
]
},

{
img: "cat_in_box.png",
answer: "The cat is in the box.",
options: [
"The cat is on the box.",
"The cat is in the box.",
"The cat is under the box."
]
},

{
img: "mouse_on_chair.png",
answer: "The mouse is on the chair.",
options: [
"The mouse is under the chair.",
"The mouse is on the chair.",
"The mouse is in the chair."
]
},

{
img: "ball_under_chair.png",
answer: "The ball is under the chair.",
options: [
"The ball is on the chair.",
"The ball is under the chair.",
"The ball is in the chair."
]
},

{
img: "spider_on_table.png",
answer: "The spider is on the table.",
options: [
"The spider is under the table.",
"The spider is in the table.",
"The spider is on the table."
]
},

{
img: "frog_under_car.png",
answer: "The frog is under the car.",
options: [
"The frog is on the car.",
"The frog is under the car.",
"The frog is in the car."
]
},

{
img: "dog_in_box.png",
answer: "The dog is in the box.",
options: [
"The dog is under the box.",
"The dog is in the box.",
"The dog is on the box."
]
},

{
img: "bird_under_tree.png",
answer: "The bird is under the tree.",
options: [
"The bird is on the tree.",
"The bird is under the tree.",
"The bird is in the tree."
]
},

{
img: "rabbit_in_basket.png",
answer: "The rabbit is in the basket.",
options: [
"The rabbit is on the basket.",
"The rabbit is in the basket.",
"The rabbit is under the basket."
]
},

{
img: "duck_in_pond.png",
answer: "The duck is in the pond.",
options: [
"The duck is under the pond.",
"The duck is in the pond.",
"The duck is on the pond."
]
},

{
img: "turtle_on_rock.png",
answer: "The turtle is on the rock.",
options: [
"The turtle is under the rock.",
"The turtle is on the rock.",
"The turtle is in the rock."
]
}

];


// ===================================
// STAGE 2: UNSCRAMBLE SENTENCES
// ===================================

const stage2 = [

[
"The cat is under the desk.",
["desk", "The", "under", "cat", "is", "the", "."]
],

[
"The ball is on the chair.",
["chair", "The", "on", "ball", "is", "the", "."]
],

[
"The dog is in the box.",
["box", "in", "The", "dog", "is", "the", "."]
],

[
"The mouse is under the table.",
["table", "is", "The", "under", "mouse", "the", "."]
],

[
"The bird is on the tree.",
["tree", "The", "on", "bird", "is", "the", "."]
],

[
"The frog is under the car.",
["car", "under", "The", "frog", "is", "the", "."]
],

[
"The rabbit is in the basket.",
["basket", "in", "The", "rabbit", "is", "the", "."]
],

[
"The spider is on the desk.",
["on", "desk", "The", "spider", "is", "the", "."]
],

[
"The duck is in the pond.",
["pond", "The", "duck", "in", "is", "the", "."]
],

[
"The turtle is on the rock.",
["rock", "The", "on", "turtle", "is", "the", "."]
]

];


// ===================================
// GAME VARIABLES
// ===================================

let student = "";
let stage = 1;
let index = 0;
let lives = 3;

let chosen = [];
let currentTokens = [];


// ===================================
// START GAME
// ===================================

function startGame() {

student = document.getElementById("studentName").value.trim();

if (student === "") {
alert("Please enter your name!");
return;
}

document.getElementById("welcome").classList.add("hidden");
document.getElementById("game").classList.remove("hidden");

render();

}


// ===================================
// DISPLAY QUESTION
// ===================================

function render() {

const totalQuestions = stage === 1
? stage1.length
: stage2.length;

document.getElementById("stageLabel").textContent =
stage === 1
? "Stage 1: Picture Sentences"
: "Stage 2: Unscramble";

document.getElementById("progress").textContent =
"Question " + (index + 1) + " / " + totalQuestions;

document.getElementById("lives").textContent = lives;

document.getElementById("feedback").textContent = "";

document.getElementById("nextBtn").classList.add("hidden");

const choices = document.getElementById("choices");

choices.innerHTML = "";

if (stage === 1) {

document.getElementById("prompt").textContent =
"Look at the picture. Choose the correct sentence.";

const picture = document.getElementById("picture");

picture.classList.remove("hidden");

picture.src = "images/" + stage1[index].img;

picture.onerror = function() {
this.alt = "Image missing: " + stage1[index].img;
};

stage1[index].options.forEach(function(option) {

let button = document.createElement("button");

button.className = "choice";
button.textContent = option;

button.onclick = function() {
checkChoice(option);
};

choices.appendChild(button);

});

}

else {

document.getElementById("prompt").textContent =
"Put the words in the correct order.";

document.getElementById("picture").classList.add("hidden");

chosen = [];

currentTokens = stage2[index][1].map(function(word, i) {
return {
word: word,
id: i
};
});

shuffle(currentTokens);

const pool = document.createElement("div");

pool.className = "tiles";
pool.id = "pool";

currentTokens.forEach(function(token) {

let button = document.createElement("button");

button.className = "tile";
button.textContent = token.word;
button.dataset.id = token.id;

button.onclick = function() {
selectTile(token.id);
};

pool.appendChild(button);

});

const answer = document.createElement("div");

answer.className = "answer";
answer.id = "answer";

choices.appendChild(pool);
choices.appendChild(answer);

const controls = document.createElement("div");

controls.className = "controls";

let undo = document.createElement("button");
undo.textContent = "Undo";
undo.onclick = undoTile;

let reset = document.createElement("button");
reset.textContent = "Reset";
reset.onclick = resetTiles;

let check = document.createElement("button");
check.textContent = "Check";
check.onclick = checkOrder;

controls.appendChild(undo);
controls.appendChild(reset);
controls.appendChild(check);

choices.appendChild(controls);

}

}


// ===================================
// CHECK STAGE 1 ANSWER
// ===================================

function checkChoice(option) {

if (option === stage1[index].answer) {

document.getElementById("feedback").textContent =
"Correct! ⭐";

document.querySelectorAll(".choice").forEach(function(button) {
button.disabled = true;
});

document.getElementById("nextBtn").classList.remove("hidden");

}

else {

lives--;

document.getElementById("lives").textContent = lives;

if (lives <= 0) {

finish(false);

}

else {

document.getElementById("feedback").textContent =
"Try again!";

}

}

}


// ===================================
// STAGE 2: SELECT WORDS
// ===================================

function selectTile(id) {

let poolButtons = document.querySelectorAll("#pool .tile");

let button = Array.from(poolButtons).find(function(b) {
return Number(b.dataset.id) === id;
});

if (!button || button.classList.contains("used")) {
return;
}

button.classList.add("used");

let token = currentTokens.find(function(t) {
return t.id === id;
});

chosen.push(token);

let answerButton = document.createElement("button");

answerButton.className = "tile";
answerButton.textContent = token.word;
answerButton.dataset.id = id;

answerButton.onclick = function() {

chosen = chosen.filter(function(t) {
return t.id !== id;
});

answerButton.remove();
button.classList.remove("used");

};

document.getElementById("answer").appendChild(answerButton);

}


// ===================================
// UNDO
// ===================================

function undoTile() {

const answer = document.getElementById("answer");

if (answer.lastChild) {

let id = Number(answer.lastChild.dataset.id);

answer.lastChild.remove();

chosen = chosen.filter(function(token) {
return token.id !== id;
});

document.querySelectorAll("#pool .tile").forEach(function(button) {

if (Number(button.dataset.id) === id) {
button.classList.remove("used");
}

});

}

}


// ===================================
// RESET WORDS
// ===================================

function resetTiles() {

chosen = [];

document.getElementById("answer").innerHTML = "";

document.querySelectorAll("#pool .tile").forEach(function(button) {
button.classList.remove("used");
});

}


// ===================================
// CHECK STAGE 2 ANSWER
// ===================================

function checkOrder() {

let sentence = chosen.map(function(token) {
return token.word;
}).join(" ");

sentence = sentence.replace(/\s+\./g, ".");

let correctSentence = stage2[index][0];

if (sentence === correctSentence) {

document.getElementById("feedback").textContent =
"Excellent! ⭐";

document.querySelectorAll("#choices button").forEach(function(button) {
button.disabled = true;
});

document.getElementById("nextBtn").classList.remove("hidden");

}

else {

lives--;

document.getElementById("lives").textContent = lives;

if (lives <= 0) {

finish(false);

}

else {

document.getElementById("feedback").textContent =
"Not correct! Try again.";

}

}

}


// ===================================
// NEXT QUESTION
// ===================================

function nextQuestion() {

index++;

const totalQuestions = stage === 1
? stage1.length
: stage2.length;

if (index >= totalQuestions) {

if (stage === 1) {

stage = 2;
index = 0;

render();

}

else {

finish(true);

}

}

else {

render();

}

}


// ===================================
// FINISH GAME
// ===================================

function finish(won) {

document.getElementById("game").classList.add("hidden");

document.getElementById("finish").classList.remove("hidden");

document.getElementById("finishName").textContent =
"Player: " + student;

document.getElementById("finishTitle").textContent =
won ? "🏆 You are a Winner!" : "Game Over!";

document.getElementById("finishMessage").textContent =
won
? "Amazing work! You completed both stages!"
: "Keep practicing and try again!";

}


// ===================================
// SHUFFLE WORDS
// ===================================

function shuffle(array) {

for (let i = array.length - 1; i > 0; i--) {

let j = Math.floor(Math.random() * (i + 1));

[array[i], array[j]] = [array[j], array[i]];

}

}

</script>

</body>
</html>
