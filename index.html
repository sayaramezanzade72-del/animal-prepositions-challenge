<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Animal Prepositions Challenge</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    font-family: "Trebuchet MS", Arial, sans-serif;
    background: linear-gradient(135deg, #e8eff8, #f6f8fc);
    color: #203047;
}

.panel {
    width: 100%;
    max-width: 780px;
    background: #ffffff;
    border-radius: 26px;
    padding: 28px;
    box-shadow: 0 18px 55px rgba(36, 55, 85, 0.12);
}

.tag {
    color: #3e8e91;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
}

h1 {
    font-size: clamp(28px, 5vw, 42px);
    line-height: 1.15;
    margin: 12px 0;
    color: #203047;
}

p {
    color: #6c7b90;
    line-height: 1.6;
}

.teacher {
    margin-top: 25px;
    text-align: center;
    color: #7d8ba0;
    font-size: 13px;
    letter-spacing: 1px;
}

input {
    width: 100%;
    padding: 15px;
    border-radius: 13px;
    border: 1.5px solid #dbe3ee;
    font-size: 17px;
    margin: 12px 0 18px;
    outline: none;
}

input:focus {
    border-color: #3e8e91;
}

button {
    border: none;
    border-radius: 13px;
    padding: 15px 20px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
}

button:disabled {
    cursor: not-allowed;
    opacity: 0.5;
    transform: none;
}

.primary {
    background: #4267b2;
    color: white;
}

.wide {
    width: 100%;
}

.hidden {
    display: none !important;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}

.stats {
    display: flex;
    gap: 10px;
}

.stat {
    padding: 10px 14px;
    border-radius: 13px;
    background: #f1f5fa;
    font-weight: bold;
    white-space: nowrap;
}

.stat span {
    color: #3e8e91;
}

.progress {
    height: 8px;
    background: #e8edf4;
    border-radius: 10px;
    overflow: hidden;
    margin: 20px 0;
}

.progress div {
    height: 100%;
    background: linear-gradient(90deg, #3e8e91, #78c3b0);
    width: 0;
    transition: width 0.3s;
}

.scene {
    min-height: 270px;
    margin: 18px 0;
    border-radius: 22px;
    overflow: hidden;
    background: #eaf3f8;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.scene svg {
    width: 100%;
    max-width: 520px;
    height: 270px;
}

.question {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    margin: 20px 0;
}

.answers {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 13px;
}

.answer {
    background: #f0f4fa;
    color: #26374d;
    border: 2px solid #e4eaf2;
    min-height: 60px;
    font-size: 15px;
}

.answer:hover:not(:disabled) {
    background: #e2ebf8;
    border-color: #4267b2;
}

.answer.correct {
    background: #dff5e9;
    border-color: #40a879;
    color: #176744;
}

.answer.wrong {
    background: #ffeded;
    border-color: #d85c67;
    color: #a32d39;
}

.feedback {
    text-align: center;
    font-weight: bold;
    min-height: 28px;
    margin: 16px 0;
    color: #3e8e91;
}

.footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 18px;
}

.small {
    font-size: 13px;
    color: #8794a8;
}

.end {
    text-align: center;
    padding: 20px 0;
}

.end h2 {
    font-size: 32px;
}

@media(max-width: 500px) {
    .panel {
        padding: 20px;
    }

    .answers {
        grid-template-columns: 1fr;
    }

    .scene {
        min-height: 220px;
    }

    .scene svg {
        height: 220px;
    }

    .question {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<main class="panel">

<!-- START SCREEN -->

<section id="start">

<div class="tag">Super Minds 1</div>

<h1>
Animal<br>
Prepositions Challenge
</h1>

<p>
Ready to play?
</p>

<label for="player">
<b>Enter your name</b>
</label>

<input
    id="player"
    maxlength="24"
    placeholder="Your name"
    autocomplete="off"
>

<button class="primary wide" id="begin">
Start Game
</button>

<div class="teacher">
Created by Ms.Ramezanzadeh
</div>

</section>

<!-- GAME SCREEN -->

<section id="game" class="hidden">

<div class="top">

<div>
    <div class="tag" id="stageLabel">STAGE 1</div>
    <h1 style="font-size:26px">
        Find the correct answer!
    </h1>
</div>

<div class="stats">

<div class="stat">
    ❤️ <span id="lives">3</span>
</div>

<div class="stat">
    ⏱ <span id="timer">20</span>s
</div>

</div>

</div>

<div class="progress">
    <div id="bar"></div>
</div>

<div class="scene" id="scene"></div>

<div class="question" id="question">
Where is the animal?
</div>

<div class="answers" id="answers"></div>

<div class="feedback" id="feedback"></div>

<div class="footer">

<span class="small" id="count">
Question 1 / 10
</span>

<button class="primary" id="next" disabled>
Next Question →
</button>

</div>

<div class="teacher">
Ms.Ramezanzadeh
</div>

</section>

<!-- END SCREEN -->

<section id="end" class="hidden end">

<div class="tag" id="resultTag"></div>

<h2 id="resultTitle"></h2>

<p id="resultText"></p>

<label for="finalName">
<b>Player</b>
</label>

<input id="finalName" readonly>

<button class="primary wide" id="again">
Play Again
</button>

<div class="teacher">
Created by Ms.Ramezanzadeh
</div>

</section>

</main>

<script>

// ==========================
// QUESTIONS
// ==========================

const questions = [

{
animal:"cat",
place:"on",
obj:"box",
sentence:"The cat is on the box.",
opts:[
"The cat is on the box.",
"The cat is in the box.",
"The cat is under the box.",
"The dog is on the box."
]
},

{
animal:"dog",
place:"in",
obj:"box",
sentence:"The dog is in the box.",
opts:[
"The dog is under the box.",
"The cat is in the box.",
"The dog is in the box.",
"The dog is on the box."
]
},

{
animal:"bird",
place:"under",
obj:"tree",
sentence:"The bird is under the tree.",
opts:[
"The bird is in the tree.",
"The bird is under the tree.",
"The bird is on the tree.",
"The fish is under the tree."
]
},

{
animal:"rabbit",
place:"in",
obj:"basket",
sentence:"The rabbit is in the basket.",
opts:[
"The rabbit is on the basket.",
"The rabbit is in the basket.",
"The rabbit is under the basket.",
"The cat is in the basket."
]
},

{
animal:"frog",
place:"on",
obj:"log",
sentence:"The frog is on the log.",
opts:[
"The frog is under the log.",
"The frog is in the log.",
"The frog is on the log.",
"The duck is on the log."
]
},

{
animal:"mouse",
place:"under",
obj:"chair",
sentence:"The mouse is under the chair.",
opts:[
"The mouse is on the chair.",
"The mouse is in the chair.",
"The mouse is under the chair.",
"The mouse is under the table."
]
},

{
animal:"duck",
place:"in",
obj:"pond",
sentence:"The duck is in the pond.",
opts:[
"The duck is in the pond.",
"The duck is under the pond.",
"The duck is on the pond.",
"The fish is in the pond."
]
},

{
animal:"monkey",
place:"on",
obj:"branch",
sentence:"The monkey is on the branch.",
opts:[
"The monkey is under the branch.",
"The monkey is on the branch.",
"The monkey is in the branch.",
"The bird is on the branch."
]
},

{
animal:"turtle",
place:"under",
obj:"rock",
sentence:"The turtle is under the rock.",
opts:[
"The turtle is on the rock.",
"The turtle is under the rock.",
"The turtle is in the rock.",
"The frog is under the rock."
]
},

{
animal:"lion",
place:"in",
obj:"cave",
sentence:"The lion is in the cave.",
opts:[
"The lion is on the cave.",
"The tiger is in the cave.",
"The lion is in the cave.",
"The lion is under the cave."
]
}

];

// ==========================
// ANIMAL IMAGES
// ==========================

const animalEmoji = {
cat:"🐈",
dog:"🐕",
bird:"🐦",
rabbit:"🐇",
frog:"🐸",
mouse:"🐭",
duck:"🦆",
monkey:"🐒",
turtle:"🐢",
lion:"🦁"
};

// ==========================
// VARIABLES
// ==========================

let name = "";
let idx = 0;
let lives = 3;
let time = 20;
let clock = null;
let locked = false;
let nextTimeout = null;

const $ = id => document.getElementById(id);

// ==========================
// SHUFFLE
// ==========================

function shuffled(array) {
    return [...array].sort(() => Math.random() - 0.5);
}

// ==========================
// SCENE GRAPHICS
// ==========================

function sceneSVG(q) {

let animal = animalEmoji[q.animal];

let shape = "";

let animalY = 145;

if(q.obj === "box") {

shape = `
<ellipse cx="210" cy="205" rx="100" ry="10" fill="#cbd6df"/>

<rect x="130" y="115" width="160" height="90"
rx="10" fill="#d5a36c" stroke="#986b3e" stroke-width="4"/>

<path d="M130 115 L210 75 L290 115"
fill="#e8bd88" stroke="#986b3e" stroke-width="4"/>

<path d="M210 75 V205"
stroke="#986b3e" stroke-width="4"/>
`;

animalY = q.place === "on" ? 85 : q.place === "in" ? 150 : 220;

}

if(q.obj === "basket") {

shape = `
<ellipse cx="210" cy="200" rx="100" ry="10" fill="#cbd6df"/>

<path d="M135 115 L285 115 L265 195 L155 195 Z"
fill="#d6a56e" stroke="#9d7042" stroke-width="4"/>

<path d="M155 145 H265 M150 170 H270"
stroke="#9d7042" stroke-width="5"/>

<path d="M150 115 Q210 30 270 115"
fill="none" stroke="#9d7042" stroke-width="7"/>
`;

animalY = q.place === "in" ? 145 : q.place === "on" ? 85 : 220;

}

if(q.obj === "tree") {

shape = `
<ellipse cx="210" cy="210" rx="110" ry="10" fill="#cbd6df"/>

<rect x="195" y="100" width="30" height="110"
fill="#986b45"/>

<circle cx="210" cy="85" r="65"
fill="#8fbd91"/>

<circle cx="160" cy="100" r="42"
fill="#a4cfa0"/>

<circle cx="260" cy="100" r="42"
fill="#7fb582"/>
`;

animalY = q.place === "under" ? 185 : q.place === "in" ? 100 : 40;

}

if(q.obj === "log") {

shape = `
<ellipse cx="210" cy="205" rx="110" ry="10" fill="#cbd6df"/>

<rect x="110" y="150" width="200" height="50"
rx="24" fill="#b9895c" stroke="#875d3b" stroke-width="4"/>

<ellipse cx="115" cy="175" rx="15" ry="25"
fill="#d0a77b" stroke="#875d3b" stroke-width="4"/>
`;

animalY = q.place === "on" ? 110 : q.place === "in" ? 170 : 220;

}

if(q.obj === "chair") {

shape = `
<ellipse cx="210" cy="205" rx="100" ry="10" fill="#cbd6df"/>

<rect x="155" y="100" width="110" height="22"
rx="4" fill="#b9895c"/>

<rect x="165" y="60" width="18" height="65"
rx="4" fill="#b9895c"/>

<rect x="170" y="120" width="14" height="85"
fill="#986b45"/>

<rect x="245" y="120" width="14" height="85"
fill="#986b45"/>
`;

animalY = q.place === "under" ? 190 : q.place === "on" ? 65 : 145;

}

if(q.obj === "pond") {

shape = `
<ellipse cx="210" cy="175" rx="135" ry="55"
fill="#8ccbd9" stroke="#5da8bd" stroke-width="5"/>

<ellipse cx="210" cy="175" rx="100" ry="35"
fill="#b4e1e8"/>

<path d="M130 165 Q160 150 190 165"
stroke="#ffffff" stroke-width="4" fill="none"/>

<path d="M225 190 Q255 175 280 190"
stroke="#ffffff" stroke-width="4" fill="none"/>
`;

animalY = q.place === "in" ? 155 : q.place === "on" ? 90 : 225;

}

if(q.obj === "branch") {

shape = `
<ellipse cx="210" cy="205" rx="100" ry="10" fill="#cbd6df"/>

<path d="M65 160 Q210 100 355 150"
stroke="#8b633c" stroke-width="25"
fill="none" stroke-linecap="round"/>

<path d="M210 130 L250 80"
stroke="#8b633c" stroke-width="14"
fill="none" stroke-linecap="round"/>

<circle cx="250" cy="70" r="35"
fill="#a4cfa0"/>
`;

animalY = q.place === "on" ? 95 : q.place === "in" ? 145 : 210;

}

if(q.obj === "rock") {

shape = `
<ellipse cx="210" cy="205" rx="100" ry="10" fill="#cbd6df"/>

<path d="M120 180 L145 115 L205 90 L270 120 L300 180 L280 200 L140 200 Z"
fill="#aab6c2" stroke="#7e8c9b" stroke-width="4"/>

<path d="M160 135 L200 110"
stroke="#d3dbe3" stroke-width="7" fill="none"/>
`;

animalY = q.place === "under" ? 195 : q.place === "on" ? 65 : 145;

}

if(q.obj === "cave") {

shape = `
<ellipse cx="210" cy="205" rx="110" ry="10" fill="#cbd6df"/>

<path d="M100 205 V120 Q210 -15 320 120 V205 Z"
fill="#9ba8b6"/>

<path d="M150 205 V130 Q210 50 270 130 V205 Z"
fill="#4b5969"/>

<path d="M110 120 L140 100 M280 100 L310 120"
stroke="#d0d8e1" stroke-width="5" fill="none"/>
`;

animalY = q.place === "in" ? 170 : q.place === "on" ? 80 : 220;

}

return `
<svg viewBox="0 0 420 240">

<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#dceef8"/>
<stop offset="100%" stop-color="#f5f9fc"/>
</linearGradient>
</defs>

<rect width="420" height="240" fill="url(#sky)"/>

<circle cx="350" cy="40" r="25" fill="#f5d98b"/>

<ellipse cx="50" cy="200" rx="80" ry="35" fill="#d9eadb"/>
<ellipse cx="370" cy="210" rx="80" ry="35" fill="#d9eadb"/>

${shape}

<text
x="210"
y="${animalY}"
font-size="58"
text-anchor="middle"
dominant-baseline="middle"
>
${animal}
</text>

</svg>
`;

}

// ==========================
// START GAME
// ==========================

function start() {

name = $("player").value.trim();

if(!name) {
    $("player").focus();
    return;
}

idx = 0;
lives = 3;

$("start").classList.add("hidden");
$("end").classList.add("hidden");
$("game").classList.remove("hidden");

render();

}

// ==========================
// RENDER QUESTION
// ==========================

function render() {

locked = false;

time = 20;

$("timer").textContent = time;
$("lives").textContent = lives;

$("stageLabel").textContent =
idx < 5 ? "STAGE 1" : "STAGE 2";

$("count").textContent =
`Question ${idx + 1} / ${questions.length}`;

$("bar").style.width =
(idx / questions.length * 100) + "%";

let q = questions[idx];

$("scene").innerHTML = sceneSVG(q);

$("question").textContent = "Where is the animal?";

$("feedback").textContent = "";

$("next").disabled = true;

let opts = shuffled(q.opts);

$("answers").innerHTML = "";

opts.forEach(option => {

let button = document.createElement("button");

button.className = "answer";

button.textContent = option;

button.onclick = () => answer(button, option, q);

$("answers").appendChild(button);

});

clearInterval(clock);

clock = setInterval(() => {

time--;

$("timer").textContent = time;

if(time <= 0) {

clearInterval(clock);

if(!locked) {
    loseLife("Time is up! Try again!");
}

}

}, 1000);

}

// ==========================
// ANSWER CHECK
// ==========================

function answer(button, option, q) {

if(locked || button.disabled) return;

if(option === q.sentence) {

locked = true;

clearInterval(clock);

button.classList.add("correct");

$("feedback").textContent =
"Excellent! That's correct!";

$("feedback").style.color = "#16845c";

document.querySelectorAll(".answer").forEach(b => {
    b.disabled = true;
});

$("next").disabled = true;

nextTimeout = setTimeout(() => {

    if(idx === questions.length - 1) {
        finish(true);
    } else {
        idx++;
        render();
    }

}, 900);

} else {

button.classList.add("wrong");

button.disabled = true;

lives--;

$("lives").textContent = lives;

$("feedback").textContent =
"Oops! Try another answer!";

$("feedback").style.color = "#d9535f";

if(lives <= 0) {

    locked = true;

    clearInterval(clock);

    setTimeout(() => {
        finish(false);
    }, 900);

}

}

}

// ==========================
// TIME OUT / LOSE LIFE
// ==========================

function loseLife(message) {

lives--;

$("lives").textContent = lives;

$("feedback").textContent = message;

$("feedback").style.color = "#d9535f";

if(lives <= 0) {

    locked = true;

    clearInterval(clock);

    setTimeout(() => {
        finish(false);
    }, 900);

} else {

    time = 20;

    $("timer").textContent = time;

    $("feedback").textContent =
    "Time is up! A life is lost. Try again!";

}

}

// ==========================
// FINISH GAME
// ==========================

function finish(win) {

clearInterval(clock);

clearTimeout(nextTimeout);

$("game").classList.add("hidden");

$("end").classList.remove("hidden");

$("finalName").value = name;

$("bar").style.width = "100%";

if(win) {

$("resultTag").textContent =
"CHALLENGE COMPLETE";

$("resultTitle").textContent =
"🏆 Fantastic work, " + name + "!";

$("resultText").textContent =
"You're an Animal Prepositions Champion! Brilliant job! You completed both stages. Keep learning and shining!";

} else {

$("resultTag").textContent =
"GAME OVER";

$("resultTitle").textContent =
"Good try, " + name + "!";

$("resultText").textContent =
"Don't give up! Practice makes progress. You can try again and become a champion!";

}

}

// ==========================
// BUTTON EVENTS
// ==========================

$("begin").onclick = start;

$("player").addEventListener("keydown", event => {

if(event.key === "Enter") {
    start();
}

});

$("next").onclick = () => {

if(idx === questions.length - 1) {
    finish(true);
} else {
    idx++;
    render();
}

};

$("again").onclick = () => {

clearInterval(clock);
clearTimeout(nextTimeout);

$("player").value = name;

$("end").classList.add("hidden");

$("start").classList.remove("hidden");

};

</script>

</body>
  </html>
